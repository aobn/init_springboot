# MyBatis-Plus配置
# 由于使用BaseMapper，不需要XML文件
# mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# 实体类别名包路径，用于简化XML中的类型引用
mybatis-plus.type-aliases-package=com.example.demo.entity

# MyBatis核心配置
# 开启驼峰命名自动映射，如：数据库字段user_name -> Java属性userName
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 开启二级缓存
mybatis-plus.configuration.cache-enabled=true
# 开启延迟加载
mybatis-plus.configuration.lazy-loading-enabled=true
# 关闭积极的延迟加载，按需加载
mybatis-plus.configuration.aggressive-lazy-loading=false
# SQL执行超时时间（秒）
mybatis-plus.configuration.default-statement-timeout=30
# SQL日志实现，打印SQL语句和参数（开发环境使用，生产环境建议关闭）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# MyBatis-Plus全局配置
# 主键类型：AUTO-数据库自增
mybatis-plus.global-config.db-config.id-type=auto
# 表名下划线转换
mybatis-plus.global-config.db-config.table-underline=true

# 日志配置
logging.level.com.example.demo=debug
logging.level.org.springframework.security=info
logging.level.org.springframework.jdbc=info
logging.level.org.mybatis=debug
# 启用彩色输出
spring.output.ansi.enabled=always
# 自定义日志格式，使错误日志显示为红色
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} - %msg%n

# Jackson配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# 缓存配置
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=600s

# 邮箱配置
spring.mail.host=smtp.163.com
spring.mail.port=465
spring.mail.username=webdom@163.com
spring.mail.password=PJgBcDuEcz3u8Ymq
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# 错误处理配置 - 统一API响应格式
# 禁用Spring Boot默认的错误页面
server.error.whitelabel.enabled=false
# 配置404异常抛出，让全局异常处理器能够捕获
spring.mvc.throw-exception-if-no-handler-found=true
# 禁用静态资源映射，确保404能被正确处理
spring.web.resources.add-mappings=false

